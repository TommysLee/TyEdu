<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!--/* 共用JS与CSS */-->
  <th:block th:replace="~{assets/include :: katex}"/>
  <th:block th:replace="~{assets/include :: scriptcss_form_editor('知识库')}"/>
</head>
<body>
  <div id="app" v-cloak>
    <v-app>
      <!-- 顶部功能区 -->
      <v-app-bar flat class="bg-grad-10" theme="dark">
        <th:block th:replace="~{assets/include :: header(back=true)}"/>
      </v-app-bar>

      <!-- 主体部分 -->
      <v-main>
        <!-- 主体容器 -->
        <v-container fluid class="pa-0">
          <v-app-bar flat color="white" class="px-4">
            <v-spacer></v-spacer>
            <v-btn variant='elevated' color="purple" :disabled="!ctgId" @click="openEntryFormDialog('新增知识库')">
              <v-icon size="small">mdi-plus</v-icon>
              {{$t('新增')}}
            </v-btn>
          </v-app-bar>

          <!-- 中间区域 -->
          <v-sheet color="grey-lighten-3" class="v-fill-height overflow-auto pa-3 pb-0" :min-height="300" style="--ty-assist-height: 104">
            <!-- 分类区域 -->
            <v-navigation-drawer class="border-top-grey-bold pt-4 px-4" :width="350">
              <v-list density="compact" mandatory v-model:selected="selectedCtgId">
                <v-list-item>
                  <v-list-item-title class="font-weight-bold" v-text="$t('分类')"></v-list-item-title>
                  <template v-slot:append>
                    <v-btn icon="mdi-plus" size="small" variant="text" @click="openCtgFormDialog('新增知识库分类')"></v-btn>
                  </template>
                </v-list-item>
                <v-divider></v-divider>
                <v-list-item color="teal" v-for="(item, i) in ctgList" :key="i" :value="item.ctgId">
                  <v-list-item-title v-text="item.ctgName"></v-list-item-title>
                  <template v-slot:append>
                    <v-speed-dial location="bottom center">
                      <template v-slot:activator="{ props: activatorProps }">
                        <v-btn v-bind="activatorProps" icon="mdi-dots-horizontal" size="small" variant="text"></v-btn>
                      </template>
                      <v-btn icon="mdi-arrow-up" :disabled="!item.prev" @click="moveCategory(item.ctgId, item.prev)"></v-btn>
                      <v-btn icon="mdi-arrow-down" :disabled="!item.next" @click="moveCategory(item.ctgId, item.next)"></v-btn>
                      <v-btn icon="mdi-square-edit-outline" @click="openCtgFormDialog('编辑知识库分类', item.ctgId)"></v-btn>
                      <v-btn icon="mdi-delete-outline" color="pink" @click="doDeleteCtg(item.ctgId)"></v-btn>
                    </v-speed-dial>
                  </template>
                </v-list-item>
              </v-list>
            </v-navigation-drawer>

            <!-- 条目列表区域 -->
            <v-card-zoom ref="econtainer" flat tile color="grey-lighten-3" class="d-block fill-height overflow-auto" :loading="loading" style="z-index: 1009">
              <v-card hover class="mb-2" v-for="item in entryList" :key="item.eid">
                <v-card-item>
                  <v-card-title class="mb-1 d-flex align-center">
                    <v-btn color="primary" variant="tonal" :ripple="false">{{item.index}}.</v-btn>
                    <v-spacer></v-spacer>
                    <v-btn icon="mdi-square-edit-outline" variant="text" color="purple" @click="openEntryFormDialog('修改知识库', item.eid)"></v-btn>
                    <v-popconfirm clazz="ml-2" :data="item.eid" @confirm="doDeleteEntry">
                      <v-btn icon="mdi-delete-outline" variant="text" color="pink"></v-btn>
                    </v-popconfirm>
                  </v-card-title>
                </v-card-item>
                <v-card-text>
                  <div class="text-subtitle-1 font-weight-bold" v-text="item.title"></div>
                  <v-card-subtitle class="pl-0" v-text="item.remark"></v-card-subtitle>
                </v-card-text>
                <v-card-actions class="border-t-thin">
                  <span class="text-subtitle-2 opacity-40">{{item.updateTime}}</span>
                  <v-spacer></v-spacer>
                  <v-btn color="teal" @click="openWinDrawer(item)">{{$t('详情')}}</v-btn>
                </v-card-actions>
              </v-card>
              <v-pagination class="pagebar" v-model="pagination.page" :total-visible="pagination.vp" :length="pagination.pageCount" :disabled="loading" v-show="entryList?.length > 0"></v-pagination>

              <!-- No Data Tips -->
              <v-empty-state class="hm-auto height-350" :headline="noDataText" v-if="!entryList || entryList?.length === 0"></v-empty-state>
            </v-card-zoom>

            <!-- 【分类】表单模态窗口 -->
            <v-dialog v-model="ctgWinDialog" persistent :fullscreen="isMobile" width="800">
              <tform as="v-form" ref="ctgDataForm" class="fill-height" @submit="doSubmitCtg">
                <v-card :loading="posting">
                  <v-toolbar color="grad-5" :title="$t(dialogTitle)">
                    <v-btn icon="mdi-close" @click="closeCtgFormDialog"></v-btn>
                  </v-toolbar>
                  <v-card-text class="overflow-auto">
                    <tfield v-model.trim="ctgFormData.ctgName" name="分类名称" v-slot="{ field, errors }" rules="required|max:50">
                      <v-text-field v-bind="field" :model-value="field.value" clearable v-blank type="text" :error-messages="errors" :label="$t('分类名称')" class="mt-1"></v-text-field>
                    </tfield>
                    <tfield v-model="ctgFormData.enabled" name="启用" v-slot="{ field, errors }" rules="required">
                      <v-radio-group v-bind="field" :model-value="field.value" :error-messages="errors" inline :label="$t('启用')+'：'">
                        <v-radio :label="$t('是')" :value="1"></v-radio>
                        <v-radio :label="$t('否')" :value="0"></v-radio>
                      </v-radio-group>
                    </tfield>
                    <tfield v-model.trim="ctgFormData.remark" name="备注" v-slot="{ field, errors }" rules="max:500">
                      <v-textarea v-bind="field" :model-value="field.value" clearable v-blank :error-messages="errors" :label="$t('备注')" class="mt-1"></v-textarea>
                    </tfield>
                  </v-card-text>
                  <v-divider></v-divider>
                  <v-card-actions>
                    <v-btn size="large" variant="elevated" color="grad-9" type="submit" :loading="posting">{{$t('保存')}}</v-btn>
                  </v-card-actions>
                </v-card>
              </tform>
            </v-dialog>

            <!-- 【条目】表单模态窗口 -->
            <v-dialog v-model="entryWinDialog" persistent fullscreen>
              <tform as="v-form" ref="entryDataForm" class="fill-height" @submit="doSubmitEntry">
                <v-card :loading="posting">
                  <v-toolbar color="grad-5" :title="$t(dialogTitle)">
                    <v-btn icon="mdi-close" @click="closeEntryFormDialog"></v-btn>
                  </v-toolbar>
                  <v-card-text class="overflow-auto d-flex flex-column">
                    <tfield v-model.trim="entryFormData.title" name="标题" v-slot="{ field, errors }" rules="required|max:100">
                      <v-text-field v-bind="field" :model-value="field.value" clearable v-blank type="text" :error-messages="errors" :label="$t('标题')" class="mt-1 flex-0-0"></v-text-field>
                    </tfield>
                    <div class="flex-fill height-min-350">
                      <div id="editor"></div>
                    </div>
                    <tfield v-model.trim="entryFormData.remark" name="备注" v-slot="{ field, errors }" rules="max:500">
                      <v-textarea v-bind="field" :model-value="field.value" clearable v-blank :error-messages="errors" :label="$t('备注')" class="mt-14 flex-0-0"></v-textarea>
                    </tfield>
                  </v-card-text>
                  <v-divider></v-divider>
                  <v-card-actions>
                    <v-btn size="large" variant="elevated" color="grad-9" type="submit" :loading="posting">{{$t('保存')}}</v-btn>
                  </v-card-actions>
                </v-card>
              </tform>
            </v-dialog>
          </v-sheet>

          <!-- 抽屉窗口：详情 -->
          <v-navigation-drawer :order="-1" v-model="winDrawer" temporary floating location="right" :width="winDrawerWidth">
            <v-layout full-height>
              <v-container class="overflow-auto">
                <v-app-bar flat color="grad-5">
                  <v-toolbar-title class="text-subtitle-1 font-weight-bold text-grad">{{winDrawerTitle}}</v-toolbar-title>
                  <v-spacer></v-spacer>
                  <v-btn icon="mdi-close" @click="winDrawer=false"></v-btn>
                </v-app-bar>
                <v-sheet class="pt-16 fill-height ql-editor ql-readonly v-rich-text">
                  <div v-katex v-html="winDrawerContent"></div>
                </v-sheet>
              </v-container>
            </v-layout>
          </v-navigation-drawer>
        </v-container>
      </v-main>
    </v-app>
  </div>

  <!-- 导入Vuetify扩展组件 -->
  <th:block th:replace="~{assets/vuetify :: v-card-zoom}"/>
  <th:block th:replace="~{assets/vuetify :: v-popconfirm}"/>

  <!-- 业务js -->
  <script type="text/javascript" th:src="@{/js/content/content.js}"></script>
</body>
</html>
