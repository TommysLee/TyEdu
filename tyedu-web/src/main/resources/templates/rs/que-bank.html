<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!--/* 共用JS与CSS */-->
  <th:block th:replace="~{assets/include :: katex}"/>
  <th:block th:replace="~{assets/include :: scriptcss('题库')}"/>
</head>
<body>
  <div id="app" v-cloak>
    <v-app>
      <!-- 顶部功能区 -->
      <v-app-bar flat>
        <th:block th:replace="~{assets/include :: header(back=true)}"/>
      </v-app-bar>

      <!-- 主体部分 -->
      <v-main>
        <!-- 主体容器 -->
        <v-container fluid class="pa-0">
          <!-- 导航菜单 -->
          <v-app-bar flat theme="light" color="white" class="px-4">
            <v-menu :close-on-content-click="false" open-on-hover :open-delay="100" :close-delay="80" :width="257">
              <template v-slot:activator="{ props }">
                <v-btn append-icon="mdi-chevron-down" color="teal" v-bind="props" size="large" variant='elevated' :width="257">
                  {{stageSujectText}}
                </v-btn>
              </template>
              <v-list v-model:selected="selectedSubject" mandatory tile density="compact" active-class="text-teal" class="py-0" border="opacity-100 success thin">
                <v-tabs v-model="stage" align-tabs="center" color="teal" show-arrows density="comfortable" class="mb-4">
                  <v-tab slim :min-width="80" v-for="item in stageList" :value="item.value">{{item.title}}</v-tab>
                </v-tabs>
                <v-row dense class="ma-0">
                  <v-col :cols="item.title.length > 2? 6: 4" v-for="item in subjectList">
                    <v-list-item class="pa-1 text-center" :key="item.value" :value="item.value">
                      <v-list-item-title class="text-subtitle-2">{{ item.title }}</v-list-item-title>
                    </v-list-item>
                  </v-col>
                </v-row>
              </v-list>
            </v-menu>
            <v-tabs v-model="selectedMenu" align-tabs="center" color="teal" show-arrows>
              <v-tab slim density="compact" size="large" :min-width="100" class="mx-4" v-for="item in menuList" :value="item.value">{{item.title}}</v-tab>
            </v-tabs>
            <v-spacer></v-spacer>
            <v-btn variant='elevated' color="primary" @click="goEdit">{{$t('录题')}}</v-btn>
          </v-app-bar>

          <!-- 中间区域 -->
          <v-sheet theme="light" color="grey-lighten-3" class="v-fill-height overflow-auto pa-3 pb-0" :min-height="300" style="--ty-assist-height: 104">
            <!-- 左侧Tree -->
            <v-navigation-drawer class="border-top-grey-bold pt-4 px-4" :width="350">
              <!-- 章节树 -->
              <v-sheet v-if="selectedMenu === 'chpt'">
                <v-menu :close-on-content-click="false" open-on-hover :open-delay="100" :close-delay="80">
                  <template v-slot:activator="{ props }">
                    <v-btn block prepend-icon="mdi-bookshelf" append-icon="mdi-chevron-down-circle" color="teal" v-bind="props" size="large" variant='text'>
                      {{editionBookText}}
                    </v-btn>
                  </template>
                  <v-sheet border="opacity-100 success thin" class="v-fill-half-width">
                    <v-row dense class="ma-0">
                      <v-col cols="1" class="text-grey-darken-1 line-height-40">
                        {{$t('版本')}}:
                      </v-col>
                      <v-col>
                        <v-list v-model:selected="selectedEdition" mandatory tile density="compact" active-class="text-teal" class="py-0">
                          <v-row dense class="ma-0">
                            <v-col :cols="item.title.length > 5? 4: 3" v-for="item in editionList">
                              <v-list-item class="pa-1 text-center" :key="item.value" :value="item.value">
                                <v-list-item-title class="text-subtitle-2">{{ item.title }}</v-list-item-title>
                              </v-list-item>
                            </v-col>
                          </v-row>
                        </v-list>
                      </v-col>
                    </v-row>
                    <v-row dense class="ma-0">
                      <v-col cols="1" class="text-grey-darken-1 line-height-40">
                        {{$t('教材')}}:
                      </v-col>
                      <v-col>
                        <v-list v-model:selected="selectedBook" mandatory tile density="compact" active-class="text-teal" class="py-0">
                          <v-row dense class="ma-0">
                            <v-col :cols="item.bname.length > 5? 4: 3" v-for="item in bookList">
                              <v-list-item class="pa-1 text-center" :key="item.bid" :value="item.bid">
                                <v-list-item-title class="text-subtitle-2">{{ item.bname }}</v-list-item-title>
                              </v-list-item>
                            </v-col>
                          </v-row>
                        </v-list>
                      </v-col>
                    </v-row>
                  </v-sheet>
                </v-menu>
                <v-treeview v-model:activated="selectedChpt" items-registration="props" activatable color="teal" density="compact" item-value="chptId" item-title="chptName" :items="chptTreeData" class="bg-transparent treeview-break">
                </v-treeview>
              </v-sheet>

              <!-- 知识点树 -->
              <v-sheet v-else>
                <v-treeview v-model:activated="selectedKnowledge" items-registration="props" activatable color="teal" density="compact" item-value="kid" item-title="kname" :items="knowledgeTreeData" class="bg-transparent treeview-break">
                </v-treeview>
              </v-sheet>
            </v-navigation-drawer>

            <!-- 题目区域 -->
            <v-card-zoom ref="qcontainer" flat tile color="grey-lighten-3" class="fill-height pa-4 overflow-auto" :loading="loading">
              <!-- 搜索条件 -->
              <v-list class="mb-2">
                <v-list-item class="font-weight-bold">
                  <template v-slot:prepend>
                    {{$t('题型')}}:
                  </template>
                  <v-btn-toggle v-model="param.type" density="comfortable" color="teal" variant="plain" class="flex-wrap h-auto" @click="doQuery">
                    <v-btn v-for="item in qtypeList" :value="item.value">{{item.title}}</v-btn>
                  </v-btn-toggle>
                </v-list-item>
              </v-list>

              <!-- 题目列表 -->
              <v-card hover class="mb-2" v-for="item in dataList">
                <v-card-item>
                  <v-card-title class="mb-1 d-flex align-center">
                    <v-btn color="primary" variant="tonal" :ripple="false">{{item.index}}.</v-btn>
                    <v-spacer></v-spacer>
                    <v-icon icon="mdi-star" size="x-small" color="yellow" v-for="i in item.difficulty"></v-icon>
                  </v-card-title>
                  <v-card-subtitle>
                    {{qtypeMap[item.type]}} <span class="px-2 opacity-40">|</span> 知识点
                  </v-card-subtitle>
                </v-card-item>
                <v-card-text class="v-rich-text" @click="item.show = !item.show">
                  <div v-katex v-html="item.stem"></div>
                  <v-expand-transition>
                    <div class="border-t-thin mt-4 pt-4" v-if="item.show">
                      <p class="font-weight-bold">{{$t('答案')}}:</p>
                      <div v-katex v-html="item.answer"></div>
                      <div v-katex v-html="item.analysis" class="mt-4"></div>
                    </div>
                  </v-expand-transition>
                </v-card-text>
                <v-card-actions class="justify-end border-t-thin">
                  <span class="text-subtitle-2 opacity-40">{{item.updateTime}}</span>
                  <v-spacer></v-spacer>
                  <v-btn color="teal" @click="goMarked(item.qid)">{{$t('打标')}}</v-btn>
                  <v-btn color="teal" @click="goEdit(item.qid)">{{$t('修改')}}</v-btn>
                </v-card-actions>
              </v-card>
              <v-pagination class="pagebar" v-model="pagination.page" :total-visible="pagination.vp" :length="pagination.pageCount" :disabled="loading" v-show="dataList?.length > 0"></v-pagination>

              <!-- No Data Tips -->
              <v-empty-state class="hm-auto height-350" :headline="noDataText" v-if="!dataList || dataList?.length === 0"></v-empty-state>
            </v-card-zoom>
          </v-sheet>
        </v-container>
      </v-main>
    </v-app>
  </div>

  <!-- 导入Vuetify扩展组件 -->
  <th:block th:replace="~{assets/vuetify :: v-card-zoom}"/>

  <!-- 业务js -->
  <script type="text/javascript" th:src="@{/js/rs/que-bank.js}"></script>
</body>
</html>
