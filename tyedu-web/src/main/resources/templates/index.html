<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>[[${#site.title()}]]</title>
  <!--/* 共用JS与CSS */-->
  <th:block th:replace="~{assets/include :: scriptcss('')}"/>
</head>
<body>
  <div id="app" v-cloak>
    <v-app>
      <!-- 顶部功能区 -->
      <v-app-bar flat>
        <th:block th:replace="~{assets/include :: header}"/>
      </v-app-bar>

      <!-- 主体部分 -->
      <v-main>
        <!-- 主体容器 -->
        <v-container fluid>
          <v-row>
            <v-col cols="12" md="4">
              <v-card hover :height="240" class="d-flex justify-center align-center text-h5" color="orange-darken-1" href="#">
                <v-icon icon="mdi-bookshelf"></v-icon>
                {{$t('题库')}}
              </v-card>
            </v-col>
            <v-col cols="12" md="4">
              <v-card hover :height="240" class="d-flex justify-center align-center text-h5" color="green-lighten-1" href="#">
                <v-icon icon="mdi-text-box-edit-outline"></v-icon>
                {{$t('考试')}}
              </v-card>
            </v-col>
            <v-col cols="12" md="4">
              <v-card hover :height="240" class="d-flex justify-center align-center text-h5" color="pink-accent-2" href="#">
                <v-icon icon="mdi-text-box-remove-outline"></v-icon>
                {{$t('我的错题')}}
              </v-card>
            </v-col>
          </v-row>
        </v-container>
      </v-main>
    </v-app>
  </div>

  <!-- 业务js -->
  <script type="text/javascript" th:src="@{/js/index.js}"></script>
</body>
</html>
